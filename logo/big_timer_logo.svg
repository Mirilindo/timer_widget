<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Big Timer — C (stopwatch with digits)</title>
  <!-- Buttons first, so the body covers their base -->
  <rect x="234" y="50" width="44" height="44" fill="#1d2b3a"/>
  <rect x="200" y="22" width="112" height="40" rx="14" fill="#1d2b3a"/>
  <rect x="240" y="62" width="32" height="44" rx="8" fill="#1d2b3a" transform="rotate(45 256 296)"/>
  <!-- Body and progress ring on its edge (3/4) -->
  <circle cx="256" cy="296" r="206" fill="#1d2b3a"/>
  <circle cx="256" cy="296" r="172" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="24"/>
  <path d="M256,124 A172,172 0 1 1 84,296" fill="none" stroke="#3daee9" stroke-width="24" stroke-linecap="round"/>
  <!-- Big digits instead of hands -->
  <text x="256" y="332" text-anchor="middle" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-weight="bold"
        font-size="96" fill="#ffffff">15:00</text>
</svg>
